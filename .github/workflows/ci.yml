name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: PokeKnomiGochi  # arduino-cli requires the folder to be named like the sketch

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Pinned to the core version verified to compile this sketch. Bump it
      # by hand and on purpose: new core versions have broken third-party
      # libraries before.
      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install libraries
        run: arduino-cli lib install "GFX Library for Arduino" SensorLib XPowersLib U8g2

      - name: Compile for Waveshare
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          PokeKnomiGochi

      - name: Compile for Knomi
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=default,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          --build-property "compiler.cpp.extra_flags=-DBOARD_KNOMI_V2"
          --build-property "compiler.c.extra_flags=-DBOARD_KNOMI_V2"
          PokeKnomiGochi

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/gen_moves.py
          python3 tools/gen_facts.py
          python3 tools/sprites.py emit

      # dex.h and species.h carry "GENERATED - do not edit" in their header; this catches
      # anyone who edits the output instead of the generator, or forgets to regenerate
      # after touching the source data.
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h moves.h species.h dexfacts.h docs/MOVES.md

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # pet.cpp / i18n.cpp / dex.h compile and run on the PC against Arduino
      # shims, with fake millis() and random() and an in-memory NVS. This is
      # where things have broken: the three bugs in v1.3, v1.4 and v1.8 were
      # pure logic and these tests catch them without touching the board.
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  windows:
    name: Build PokeWinGochi.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned like the ESP32 core: the same llvm-mingw the release is built with on the Mac
      - name: Install llvm-mingw and zsh
        run: |
          sudo apt-get install -y zsh
          curl -sSL https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz | tar xJ -C $HOME
          echo "$HOME/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64/bin" >> $GITHUB_PATH
      - run: zsh windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PokeWinGochi
          path: build/win/PokeWinGochi.exe

  i18n:
    name: i18n format-specifier consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_i18n_formats.py
