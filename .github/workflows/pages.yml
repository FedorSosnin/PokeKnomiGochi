# Publishes to GitHub Pages: the Knomi installer at the root (the README's link, and where Knomis
# download Wi-Fi updates from), the Waveshare one under /waveshare/, /play/ pointing to
# PokeWebGochi's own site (tools/publish_web.sh), and the Shiny Pokédex under /sprites/, built from the packs.
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml', 'tools/sdcard/mons/**', 'tools/dex_data.py',
            'tools/make_sprite_gallery.py', 'tools/sprite_gallery.html', 'tools/voices.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R web/knomi/. site/
          # PokeWebGochi lives at its own address only (a second one would keep a second save)
          mkdir -p site/play
          printf '<!doctype html><meta charset="utf-8"><title>PokeWebGochi</title><meta http-equiv="refresh" content="0; url=https://pokewebgochi.3dprintsos.com/"><a href="https://pokewebgochi.3dprintsos.com/">PokeWebGochi has moved</a>\n' > site/play/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Shiny Pokédex
        run: |
          pip install pillow
          python3 tools/make_sprite_gallery.py site/sprites
      # (v5 of both: with v3 and v4 the deploy stopped finding the uploaded site, "Found 0 artifact(s)", 2.0.7)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
